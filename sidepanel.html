<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Glasswing</title>
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body>
    <div id="app">
      <header class="bar">
        <div class="brand">
          <img src="icons/icon-32.png" alt="" width="22" height="22" />
          <span>Glasswing</span>
        </div>
      </header>

      <div class="toolbar">
        <button id="run-btn" class="primary">Check this page</button>
        <div id="summary" class="summary" hidden>
          <p id="verdict" class="verdict"></p>
          <div class="chips" id="chips"></div>
          <p id="scope" class="scope"></p>
        </div>
      </div>

      <main id="list" class="list" aria-live="polite"></main>

      <footer class="foot">
        <p>
          Automatic checks catch roughly a third of real accessibility barriers. A clean result is a
          starting point, not a certificate.
        </p>
      </footer>

      <div id="toast" class="toast" role="status" aria-live="polite"></div>
    </div>
    <script type="module" src="dist/sidepanel.js"></script>
  </body>
</html>
